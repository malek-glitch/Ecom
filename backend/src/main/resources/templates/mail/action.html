<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:dir="${dir}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title th:text="${subject}">Subject</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans Arabic',Tahoma,Arial,sans-serif;color:#18181b;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;" th:text="${preheader}">Preheader</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" th:dir="${dir}"
               style="max-width:560px;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;">
          <tr>
            <td th:style="'padding:28px 32px 0 32px;font-size:18px;font-weight:700;text-align:' + ${align}" th:text="${appName}">Liftoff</td>
          </tr>
          <tr>
            <td th:style="'padding:20px 32px 0 32px;font-size:15px;line-height:1.6;text-align:' + ${align}">
              <p style="margin:0 0 12px 0;" th:text="${greeting}">Hello,</p>
              <p style="margin:0 0 20px 0;" th:text="${intro}">Intro</p>
            </td>
          </tr>
          <tr th:if="${actionUrl != null}">
            <td align="center" style="padding:4px 32px 24px 32px;">
              <a th:href="${actionUrl}" th:text="${actionLabel}"
                 style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:8px;">Action</a>
            </td>
          </tr>
          <tr>
            <td th:style="'padding:0 32px 8px 32px;font-size:13px;line-height:1.6;color:#52525b;text-align:' + ${align}">
              <p style="margin:0 0 12px 0;" th:text="${outro}">Outro</p>
              <p th:if="${actionUrl != null}" style="margin:0 0 8px 0;">
                <span th:text="${fallback}">If the button doesn't work, copy this link:</span><br>
                <a dir="ltr" th:href="${actionUrl}" th:text="${actionUrl}" style="color:#2563eb;word-break:break-all;">https://example.com</a>
              </p>
            </td>
          </tr>
          <tr>
            <td th:style="'padding:16px 32px 28px 32px;font-size:12px;line-height:1.5;color:#a1a1aa;text-align:' + ${align}" th:text="${footer}">Footer</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
