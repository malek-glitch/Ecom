# Les messages ont des arguments : une apostrophe s'écrit deux fois ('').
mail.greeting=Bonjour {0},
mail.fallback=Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur :
mail.footer=Vous recevez cet e-mail en raison d''un compte sur {0}. Si ce n''était pas vous, ignorez-le.

mail.verify.subject=Confirmez votre adresse e-mail
mail.verify.preheader=Un clic pour finaliser votre compte {0}.
mail.verify.intro=Merci pour votre inscription sur {0}. Confirmez qu''il s''agit bien de votre adresse e-mail.
mail.verify.action=Confirmer mon e-mail
mail.verify.outro=Pour votre sécurité, ce lien expire bientôt et ne fonctionne qu''une seule fois.

mail.reset.subject=Réinitialisez votre mot de passe
mail.reset.preheader=Une réinitialisation du mot de passe de votre compte {0} a été demandée.
mail.reset.intro=Nous avons reçu une demande de réinitialisation du mot de passe de votre compte {0}.
mail.reset.action=Choisir un nouveau mot de passe
mail.reset.outro=Ce lien expire bientôt. Si vous n''êtes pas à l''origine de cette demande, ignorez cet e-mail : votre mot de passe reste inchangé.

mail.invite.subject={1} vous invite sur {0}
mail.invite.preheader=Votre compte {0} est prêt.
mail.invite.intro={1} vous a créé un compte sur {0}. Choisissez un mot de passe pour commencer.
mail.invite.action=Accepter l''invitation
mail.invite.outro=Cette invitation expire dans quelques jours.

mail.password_changed.subject=Votre mot de passe a été modifié
mail.password_changed.preheader=Alerte de sécurité pour votre compte {0}.
mail.password_changed.intro=Le mot de passe de votre compte {0} vient d''être modifié et toutes les autres sessions ont été déconnectées.
mail.password_changed.action=Se connecter
mail.password_changed.outro=Si vous n''êtes pas à l''origine de ce changement, réinitialisez votre mot de passe immédiatement et contactez le support.

# E-mails de commande : {1} est le numéro de commande (#1001), {2} le montant total.
mail.order_placed.subject=Commande {1} confirmée
mail.order_placed.preheader=Merci pour votre achat sur {0}.
mail.order_placed.intro=Merci pour votre commande {1} sur {0}. Nous l''avons bien reçue et la préparons rapidement. Total : {2}.
mail.order_placed.action=Voir ma commande
mail.order_placed.outro=Nous vous écrirons à nouveau à l''expédition. Paiement par virement ? Les coordonnées bancaires figurent sur la page de la commande.

mail.order_shipped.subject=La commande {1} est en route
mail.order_shipped.preheader=Votre commande {0} a été expédiée.
mail.order_shipped.intro=Bonne nouvelle : votre commande {1} a été expédiée.
mail.order_shipped.action=Suivre ma commande
mail.order_shipped.outro=Merci encore pour votre confiance.

mail.order_cancelled.subject=La commande {1} a été annulée
mail.order_cancelled.preheader=Du nouveau concernant votre commande {0}.
mail.order_cancelled.intro=Votre commande {1} ({2}) a été annulée.
mail.order_cancelled.action=Voir la commande
mail.order_cancelled.outro=Si vous avez déjà payé, vous serez remboursé.

# Alerte de stock aux administrateurs : {1} est le nom du produit, {2} les unités restantes.
mail.low_stock.subject=Stock faible : {1}
mail.low_stock.preheader=Plus que {2} en stock.
mail.low_stock.intro=Le stock de {1} baisse sur {0} : plus que {2} en stock.
mail.low_stock.action=Gérer le stock
mail.low_stock.outro=Réapprovisionnez ou corrigez le stock depuis la page Stock. Vous pouvez désactiver ces alertes dans les réglages.
