# English (fallback for any locale without its own file).
# Messages take arguments, so a literal apostrophe must be written twice ('').
mail.greeting=Hello {0},
mail.fallback=If the button doesn''t work, copy this link into your browser:
mail.footer=You received this email because of an account on {0}. If that wasn''t you, you can ignore it.

mail.verify.subject=Confirm your email address
mail.verify.preheader=One click to finish setting up your {0} account.
mail.verify.intro=Thanks for signing up to {0}. Please confirm that this is your email address.
mail.verify.action=Confirm my email
