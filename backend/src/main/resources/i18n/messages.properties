mail.password_changed.subject=Your password was changed
mail.password_changed.preheader=Security notice for your {0} account.
mail.password_changed.intro=The password of your {0} account was just changed, and every other session was signed out.
mail.password_changed.action=Sign in
mail.password_changed.outro=If you didn''t do this, reset your password right away and contact support.

# Order emails: {1} is the order number (#1001), {2} the order total.
mail.order_placed.subject=Order {1} confirmed
